name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: container-${{ matrix.target }}

      # A shipped image with an empty embedded panel is a broken deliverable someone might
      # actually enable and find nothing: build the real frontend before the target compiles.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the web panel frontend
        working-directory: crates/terrustia/web-panel
        run: |
          bun install --frozen-lockfile
          bun run build

      # `ring` (pulled in transitively through `rustls`, via `ureq`'s HTTPS client for the update
      # checker) runs real C compiler-family detection in its build script, so a linker alone is
      # not enough for the musl targets. This is the same step ci.yml and release.yml already use.
      # An earlier revision of this file built both targets with only rust-lld and claimed nothing
      # in the dependency graph needs a C compiler; that stopped being true when the update
      # checker's TLS stack arrived, and this job was red on every push until it caught up.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p terrustia --target ${{ matrix.target }}

      # The Dockerfile copies dist/terrustia-linux-${TARGETARCH}, so stage exactly that name.
      - name: Stage the binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/terrustia" "dist/terrustia-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/terrustia-linux-${{ matrix.arch }}
          if-no-files-found: error

  image:
    name: Assemble, push and prove the image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `github.repository` keeps the owner's and repo's casing, and OCI references must be
      # lowercase. buildx normalises the name it pushes, but cosign parses the reference
      # literally, so a repository named `Trust` made the signing step fail.
      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      # An image that has never been started is not a working image. This proves the container
      # comes up with no configuration at all, generates a world, and accepts a connection.
      - name: Run it with no configuration
        run: |
          docker run -d --name probe -v terrustia-probe:/data \
            -p 7777:7777 "${IMAGE}:edge" || \
            docker run -d --name probe -v terrustia-probe:/data \
              -p 7777:7777 "$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          for _ in $(seq 1 180); do
            if docker exec probe nc -z 127.0.0.1 7777; then
              echo "the container serves with no configuration"
              docker rm -f probe
              exit 0
            fi
            sleep 1
          done
          echo "the container never started serving:"
          docker logs probe
          exit 1
